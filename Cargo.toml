[workspace]
resolver = "3"
members = ["crates/bioformats", "crates/bfconvert"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
repository = "https://github.com/ome/bioformats"

[workspace.dependencies]
bioformats = { path = "crates/bioformats" }

[profile.release]
lto = "thin"
codegen-units = 1
